    const q=new URLSearchParams(location.search);
    const forceReset=q.get('reset')==='1';

    function clearDemoNamespace(){
      const keys=[];
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&k.startsWith(PREFIX)) keys.push(k);
      }
      keys.forEach(k=>localStorage.removeItem(k));
    }

    function injectDemoUI(app){
      const styleMarker='</style>';
      const demoCss=`
/* Demo launcher · isolated onboarding entry. */
.modal.wiz.is-home .wiz-demo-launch{
  align-self:flex-start;min-width:178px;height:34px;margin-top:-5px;padding:0 10px 0 12px;
  display:inline-flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid color-mix(in srgb,var(--hot) 42%,var(--line2));border-radius:9px;
  background:color-mix(in srgb,var(--hot) 7%,var(--panel));color:var(--txt);
  font:700 11.5px/1 var(--sans);letter-spacing:.01em;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  transition:border-color .15s var(--ease),background .15s var(--ease),transform .15s var(--ease),opacity .15s var(--ease);
}
.modal.wiz.is-home .wiz-demo-launch:hover{border-color:var(--hot);background:var(--hotbg);transform:translateY(-1px)}
.modal.wiz.is-home .wiz-demo-launch:disabled{opacity:.58;cursor:wait;transform:none}
.modal.wiz.is-home .wiz-demo-meta{
  display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:20px;padding:0 6px;
  border:1px solid var(--line2);border-radius:999px;background:var(--panel2);color:var(--faint);
  font:700 8.5px/1 var(--mono);letter-spacing:.04em;
}
@media(max-width:820px){.modal.wiz.is-home .wiz-demo-launch{margin-top:-3px}}
`;
      if(!app.includes(styleMarker)) throw new Error('No se encontró el bloque de estilos de Tungsten.');
      app=app.replace(styleMarker,demoCss+styleMarker);

      const markupMarker=`            '<span class="wiz-rule" aria-hidden="true"></span>' +`;
      const demoMarkup=`            '<span class="wiz-rule" aria-hidden="true"></span>' +\n            '<button type="button" class="wiz-demo-launch" data-act="demoLoad21" title="' + esc(tr('Load the populated 21-day example','Cargar el ejemplo poblado de 21 días')) + '">' +\n              '<span class="wiz-demo-label">' + tr('Demo version','Versión demo') + '</span>' +\n              '<span class="wiz-demo-meta">21d</span></button>' +`;
      if(!app.includes(markupMarker)) throw new Error('La portada de onboarding cambió; no se pudo colocar el botón demo de forma segura.');
      app=app.replace(markupMarker,demoMarkup);

      const actionMarker='  openImport: openImport,\n';
      const demoAction=`  openImport: openImport,\n  demoLoad21: async function (el) {\n    const previous = el ? el.innerHTML : '';\n    if (el) { el.disabled = true; el.setAttribute('aria-busy','true'); }\n    try {\n      const raw = Uint8Array.from(atob('${FIXTURE_GZIP_B64}'), function(c){ return c.charCodeAt(0); });\n      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));\n      const text = await new Response(stream).text();\n      const parsed = parseImportText(text);\n      if (!parsed.ok) throw new Error(parsed.error);\n      const analyzed = analyzeImport(parsed.data, 'replace_all');\n      if (!analyzed.ok) throw new Error(analyzed.error);\n      if (analyzed.kind !== 'state') throw new Error('The demo fixture must be a full Tungsten backup.');\n      applyAnalysis(analyzed);\n    } catch (e) {\n      console.error('[Tungsten demo]', e);\n      if (el) { el.disabled = false; el.removeAttribute('aria-busy'); el.innerHTML = previous; }\n      toast(tr('Could not load the demo example.','No se pudo cargar el ejemplo demo.'), 'err');\n    }\n  },\n`;
      if(!app.includes(actionMarker)) throw new Error('El mapa de acciones de Tungsten cambió; no se pudo conectar el botón demo de forma segura.');
      return app.replace(actionMarker,demoAction);
    }

    async function boot(){
      if(forceReset){
        clearDemoNamespace();
        history.replaceState(null,'',location.pathname);
      }

      const response=await fetch('./index.html',{cache:'no-store'});
      if(!response.ok) throw new Error('No se pudo cargar index.html ('+response.status+').');
      let app=await response.text();
      const coreMarker='tungsten-core-';
      if(!app.includes(coreMarker)) throw new Error('La versión actual de Tungsten ya no usa el namespace esperado; revisa demo.html antes de publicarlo.');
      app=app.split(coreMarker).join(PREFIX);
      app=injectDemoUI(app);

      document.open();
      document.write(app);
      document.close();
    }

    try{ await boot(); }catch(err){
      console.error(err);
      const el=document.getElementById('boot');
      if(el) el.innerHTML='<b>No se pudo abrir la demo</b><span class="err"></span>';
      const msg=document.querySelector('.err');
      if(msg) msg.textContent=String(err&&err.message||err);
    }
  })();
  </script>
