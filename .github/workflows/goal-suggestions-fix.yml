name: One-off suggested goals repair
'on':
  push:
    branches:
      - goal-suggestions-fix
    paths:
      - .github/workflows/goal-suggestions-fix.yml
permissions:
  contents: write
jobs:
  patch-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-suggestions-fix
          fetch-depth: 0
      - name: Patch, validate, and package
        run: python3 tools/goal_suggestions_fix.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tungsten_OS_suggested_goals_fix
          path: Tungsten_OS_suggested_goals_fix.zip
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/goal-suggestions-fix.yml tools/goal_suggestions_fix.py Tungsten_OS_suggested_goals_fix.zip
          git add -- index.html .github/workflows/goal-suggestions-fix.yml tools/goal_suggestions_fix.py
          git diff --cached --check
          git commit -m "Fix suggested goals onboarding cards"
          git push origin HEAD:goal-suggestions-fix
