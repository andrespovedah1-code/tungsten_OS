name: One-off goal card height and wizard step nav
'on':
  push:
    branches:
      - goal-card-height-step-nav
    paths:
      - .github/workflows/goal-card-step-nav.yml
permissions:
  contents: write
jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-card-height-step-nav
          fetch-depth: 0
      - name: Patch and validate
        run: python3 tools/goal_card_step_nav_fix.py
      - name: Commit validated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/goal-card-step-nav.yml tools/goal_card_step_nav_fix.py
          git add -- index.html .github/workflows/goal-card-step-nav.yml tools/goal_card_step_nav_fix.py
          git diff --cached --check
          git commit -m "Fix suggested goal card height and wizard step navigation"
          git push origin HEAD:goal-card-height-step-nav
