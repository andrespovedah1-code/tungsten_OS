<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tungsten Pro — Decide qué importa. Haz que avance.</title>
<meta name="description" content="Tungsten Pro conecta proyectos, metas, hábitos, finanzas y progreso en un sistema local para convertir dirección en ejecución diaria.">
<meta property="og:title" content="Tungsten Pro — Decide qué importa. Haz que avance.">
<meta property="og:description" content="Un sistema personal para conectar dirección, ejecución, dinero y progreso.">
<link rel="icon" type="image/svg+xml" href="./assets/landing/tungsten-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="./assets/landing/css-1.css">
<link rel="stylesheet" href="./assets/landing/css-2.css">
<link rel="stylesheet" href="./assets/landing/css-3.css">
<link rel="stylesheet" href="./assets/landing/css-4.css">
<link rel="stylesheet" href="./assets/landing/css-5.css">
<link rel="stylesheet" href="./assets/landing/css-6.css">
<link rel="stylesheet" href="./assets/landing/css-7.css">
<link rel="stylesheet" href="./assets/landing/css-8.css">
</head>
<body>
<div id="landing-root" aria-live="polite"></div>
<noscript><div style="padding:48px;color:#edf2f8;background:#06080c;font-family:Arial,sans-serif">Tungsten Pro necesita JavaScript para mostrar esta página.</div></noscript>
<script>
(async function(){
 const files=[1,2,3,4,5,6,7,8].map(i=>`./assets/landing/html-${i}.html`);
 try{
   const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:"no-store"});if(!r.ok)throw new Error(f+" "+r.status);return r.text()}));
   const root=document.getElementById("landing-root"); root.outerHTML=parts.join("");
   const s=document.createElement("script");s.src="./assets/landing/landing.js";s.defer=true;document.body.appendChild(s);
 }catch(e){console.error(e);document.getElementById("landing-root").innerHTML="<div style='padding:48px;color:#edf2f8;background:#06080c;font-family:Arial,sans-serif'>No se pudo cargar Tungsten Pro.</div>"}
})();
</script>
</body>
</html>
